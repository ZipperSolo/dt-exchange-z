---
name: "Prerelease"

on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "*"

jobs:
  gh_pre_release:
    name: "Prerelease"
    runs-on: "ubuntu-latest"
    # The repo's default GITHUB_TOKEN is read-only; creating the "latest" tag
    # and release needs write access to contents.
    permissions:
      contents: write

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"

      - name: "Build"
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm i
      - run: npm run build
      - run: npm test

      - name: "Update latest release"
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Latest Build"
          files: "builds/*.zip"
